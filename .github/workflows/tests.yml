name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  chromhmm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python examples/run_example.py --outdir sample-results-ci
      - run: python examples/post_segmentation/run_example.py --outdir post-results-ci
